name: Feature request
description: Propose a change that is ready to become agreed work.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form when you can describe **actionable** work.

        Broad ideas, "what if we…", and architecture questions belong in
        [Discussions](https://github.com/novique-ai/retinue/discussions).
        An accepted Discussion can be turned into an Issue later.

        Search [existing issues](https://github.com/novique-ai/retinue/issues)
        and read [docs/roadmap.md](https://github.com/novique-ai/retinue/blob/main/docs/roadmap.md)
        first. Large features should be discussed before anyone writes code —
        see [CONTRIBUTING.md](https://github.com/novique-ai/retinue/blob/main/CONTRIBUTING.md).

  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do that you cannot do today?
      placeholder: |
        I want two retainers to hand off a writing task in one room, but
        currently I have to…
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed behavior
      description: What should happen? UI copy, API shape, or config keys if you know them.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other shapes you thought about, including "do this upstream in Hermes" or "this is already a skill."

  - type: dropdown
    id: surface
    attributes:
      label: Surface
      multiple: true
      options:
        - Rooms / turn-taking
        - Web UI
        - Hire / agents / sidebar
        - Voice
        - Workspace computer / podman
        - IDE-attached rooms
        - Routines
        - Packaging / install
        - AI provider / model preset
        - Documentation / contributor tooling
        - Other
    validations:
      required: true

  - type: dropdown
    id: desktop
    attributes:
      label: Desktop / platform (if relevant)
      multiple: true
      options:
        - Not desktop-specific
        - Linux (general)
        - Wayland
        - X11
        - KDE
        - GNOME
        - Other desktop
        - macOS / Windows / WSL (unsupported, but relevant)

  - type: dropdown
    id: provider
    attributes:
      label: AI provider (if relevant)
      options:
        - Not provider-specific
        - xAI (API or OAuth)
        - Anthropic
        - OpenAI
        - Local (llama.cpp / vLLM / Ollama / LM Studio)
        - Other cloud provider

  - type: dropdown
    id: scope
    attributes:
      label: Rough size
      options:
        - Small (a few files)
        - Medium
        - Large (needs a Discussion first)

  - type: checkboxes
    id: pr-ready
    attributes:
      label: Contribution
      options:
        - label: I would like to implement this and open a pull request
        - label: I have opened a Discussion for this idea already
