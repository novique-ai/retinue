name: Setup / installation help
description: You cannot get from clone to a running room.
title: "[Setup]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        For "how should this work?" questions, prefer
        [Discussions](https://github.com/novique-ai/retinue/discussions).
        Use this form when a documented setup step failed.

        First pass: [docs/development.md](https://github.com/novique-ai/retinue/blob/main/docs/development.md)
        and `./scripts/retinue-dev-setup.sh`.

  - type: textarea
    id: description
    attributes:
      label: What are you trying to do, and where does it fail?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Commands you ran
      description: Paste the exact commands, including any `HERMES_HOME` / `RETINUE_*` exports.
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      options:
        - scripts/retinue-dev-setup.sh
        - Manual uv / pip from a clone
        - Existing Hermes install + rooms env
        - Other
    validations:
      required: true

  - type: input
    id: distro
    attributes:
      label: Linux distribution
      placeholder: Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Output of python3 --version
      placeholder: "3.12.3"

  - type: input
    id: commit
    attributes:
      label: git commit
      description: Output of git rev-parse --short HEAD
      placeholder: "30a518d20"

  - type: textarea
    id: error-output
    attributes:
      label: Full error output
      render: shell
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What you already tried
      placeholder: |
        - Reran retinue-dev-setup.sh
        - Built retinue-web/dist
        - Confirmed RETINUE_ROOMS_ENABLED=1 and GATEWAY_MULTIPLEX_PROFILES=true
