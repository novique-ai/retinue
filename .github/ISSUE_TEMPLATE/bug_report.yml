name: Bug report
description: Something in Retinue is broken, crashes, or behaves incorrectly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please search [existing issues](https://github.com/novique-ai/retinue/issues) first.

        If this is inherited Hermes Agent behavior and you can reproduce it in [upstream](https://github.com/NousResearch/hermes-agent) *without* rooms enabled, file it there and link it here.

        Security issues go to [SECURITY.md](https://github.com/novique-ai/retinue/blob/main/.github/SECURITY.md), not this form.

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A short description. Error text and screenshots help.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. `export HERMES_HOME=$HOME/.retinue RETINUE_ROOMS_ENABLED=1 GATEWAY_MULTIPLEX_PROFILES=true`
        2. `hermes gateway`
        3. Open http://127.0.0.1:8643
        4. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected surface
      multiple: true
      options:
        - Rooms / turn-taking
        - Web UI
        - Hire / agents / sidebar
        - Voice
        - Workspace computer / podman
        - Routines
        - Setup / install / gateway start
        - Inherited Hermes (please link upstream if you can)
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: retinue-version
    attributes:
      label: Retinue version / commit
      description: Output of `git -C /path/to/retinue rev-parse --short HEAD` (or the footer SHA if the UI shows one).
      placeholder: "30a518d20"
    validations:
      required: true

  - type: input
    id: distro
    attributes:
      label: Linux distribution
      description: e.g. Ubuntu 24.04, Fedora 41, Arch, Debian 13. Say "not Linux" if that is the case.
      placeholder: Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: desktop
    attributes:
      label: Desktop environment
      description: e.g. KDE Plasma 6, GNOME 47, none (headless / SSH).
      placeholder: KDE Plasma 6

  - type: dropdown
    id: display-server
    attributes:
      label: Display server
      options:
        - Wayland
        - X11
        - Mixed / unsure
        - None (headless or SSH-only)
        - Not Linux

  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      options:
        - git clone + scripts/retinue-dev-setup.sh
        - git clone + manual uv / pip
        - Existing Hermes install, rooms enabled
        - Container / other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        Gateway journal or terminal output, browser console for UI bugs, `hermes doctor` if startup failed.
        Redact API keys. Prefer pasting text over screenshots of text.
      render: shell

  - type: checkboxes
    id: pr-ready
    attributes:
      label: Contribution
      options:
        - label: I would like to fix this and open a pull request
