# Fast checks for the Retinue product delta.
# Inherited Hermes CI still runs via ci.yml; this workflow is the
# check contributors should watch on a rooms / web / docs PR.
#
# The `Protect main` ruleset requires the job named "Retinue delta" — and, as
# of 2026-08-21, only that job. ci.yaml's "All required checks pass" runs on
# every PR and is worth reading, but does not gate a merge here.
name: Retinue delta

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: retinue-delta-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rooms-tests:
    name: Rooms tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install Python and [dev] extras from lock
        run: |
          uv python install 3.12
          uv sync --locked --python 3.12 --extra dev
      - name: Run rooms plugin tests
        run: |
          source .venv/bin/activate
          pytest plugins/platforms/retinue_rooms -q

  web-build:
    name: Web UI build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: retinue-web/package-lock.json
      - name: Install, test, and build retinue-web
        working-directory: retinue-web
        run: |
          npm ci
          # The runner walks test/ and src/ for *.test.ts(x) and hard-fails on
          # an empty scan. Naming entry points here instead is what left
          # test/cron.ui.test.tsx unexecuted since it was written (#180).
          node test/run-ui-tests.mjs
          npm run build

  retinue-delta:
    name: Retinue delta
    needs: [rooms-tests, web-build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both lanes
        env:
          ROOMS: ${{ needs.rooms-tests.result }}
          WEB: ${{ needs.web-build.result }}
        run: |
          echo "rooms-tests: $ROOMS"
          echo "web-build:   $WEB"
          if [ "$ROOMS" != success ] || [ "$WEB" != success ]; then
            echo "::error::Retinue delta failed (rooms=$ROOMS web=$WEB)"
            exit 1
          fi
