name: Review labels

# Retinue-owned (see retinue/FORK-POLICY.md). Upstream requires a
# maintainer-applied ``ci-reviewed`` label whenever CI-sensitive files, the MCP
# catalog, or a critical supply-chain finding are touched. That gate encodes
# NousResearch's review process for their repository, and it fires on this fork
# by construction: an upstream sync changes .github/workflows/ every time, so
# every sync PR would be blocked pending a label that only we could apply to
# our own merge — a human-review gate the same person satisfies, which is
# ceremony rather than review.
#
# The sibling attribution gate (contributor-check.yml) is deliberately KEPT
# unmodified: its data is cheap, it catches something real, and it does not
# fire on every sync.
#
# This replacement keeps the call interface byte-compatible with upstream's —
# same inputs, same declared outputs — so ci.yml can stay pristine and keep
# receiving upstream improvements. Only this one file is owned, via
# ``merge=ours`` in .gitattributes.
#
# If this fork ever takes outside contributors, reinstate upstream's version:
# the gate is sound for a repository whose reviewers are not its authors.

on:
  workflow_call:
    inputs:
      ci_review:
        description: Whether CI-sensitive files (eslint config, workflows, actions) changed.
        type: boolean
        default: false
      ci_review_files:
        description: JSON list of CI-sensitive files changed by the pull request.
        type: string
        default: '[]'
      mcp_catalog:
        description: Whether the MCP catalog / installer changed.
        type: boolean
        default: false
      supply_chain:
        description: Whether the critical supply-chain scan found a risk requiring review.
        type: boolean
        default: false
    outputs:
      ci_reviewed:
        description: Always "true" on this fork — the label gate is not enforced here.
        value: ${{ jobs.check.outputs.ci_reviewed }}
      review_status:
        description: JSON array of status objects for the review comment assembler.
        value: ${{ jobs.check.outputs.review_status }}

permissions:
  contents: read

jobs:
  check:
    name: Review label gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ci_reviewed: ${{ steps.report.outputs.ci_reviewed }}
      review_status: ${{ steps.report.outputs.review_status }}
    steps:
      - name: Report (not enforced on this fork)
        id: report
        env:
          CI_REVIEW: ${{ inputs.ci_review }}
          CI_REVIEW_FILES: ${{ inputs.ci_review_files }}
          MCP_CATALOG: ${{ inputs.mcp_catalog }}
          SUPPLY_CHAIN: ${{ inputs.supply_chain }}
        run: |
          # Still say WHAT tripped it, so the signal is not lost — only the
          # blocking is. A reviewer reading the run sees the same areas
          # upstream's comment would have flagged.
          echo "Review-sensitive areas touched by this PR:"
          echo "  ci_review    = ${CI_REVIEW}"
          echo "  mcp_catalog  = ${MCP_CATALOG}"
          echo "  supply_chain = ${SUPPLY_CHAIN}"
          if [ "${CI_REVIEW}" = "true" ]; then
            echo "  ci_review_files = ${CI_REVIEW_FILES}"
          fi
          echo
          echo "Not enforced on this fork (retinue/FORK-POLICY.md)."
          echo "ci_reviewed=true" >> "$GITHUB_OUTPUT"
          echo "review_status=[]" >> "$GITHUB_OUTPUT"
